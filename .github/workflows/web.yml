name: web-foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npx --yes --package=npm@11.9.0 --call 'npm ci --ignore-scripts'
      - run: npx --yes --package=npm@11.9.0 --call 'npm run validate:plan'
      - run: npx --yes --package=npm@11.9.0 --call 'npm run build'
      - run: npx --yes --package=npm@11.9.0 --call 'npm test'
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npx --yes --package=npm@11.9.0 --call 'npm run test:browser'
      - run: npx --yes --package=npm@11.9.0 --call 'npm run test:clone'
      - run: npx --yes --package=npm@11.9.0 --call 'npm run package:web'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-${{ github.sha }}
          path: dist/release/
          retention-days: 14
          if-no-files-found: error
